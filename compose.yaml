name: pitchgrill
x-backend: &backend
  image: pitchgrill-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /app/data
  volumes:
    - pitchgrill-data:/app/data
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  mem_limit: 768m
  pids_limit: 100
  networks: [app]

services:
  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  worker:
    <<: *backend
    command: [python, -m, backend.worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import time; from backend.store import SQLiteStore; from backend.config import settings; from backend.store import FirestoreStore; s=FirestoreStore() if settings().storage_backend=='firestore' else SQLiteStore(); w=s.get('system','health','worker'); assert w and time.time()-w['time']<920"]
      interval: 15s
      timeout: 10s
      retries: 3
  frontend:
    image: pitchgrill-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 100
    networks: [app]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pitchgrill-data:
networks:
  app:
