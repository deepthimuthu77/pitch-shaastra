substitutions:
  _REGION: us-central1
  _API_URL: https://replace-with-your-api.run.app
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, backend/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/pitchgrill/api:$BUILD_ID', .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, frontend/Dockerfile, --build-arg, 'NEXT_PUBLIC_API_URL=${_API_URL}', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/pitchgrill/web:$BUILD_ID', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/pitchgrill/api:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/pitchgrill/web:$BUILD_ID'
options:
  logging: CLOUD_LOGGING_ONLY
